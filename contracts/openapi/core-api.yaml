openapi: 3.1.0
info:
  title: Nexuss Core API
  version: 0.0.1
  description: Confidential prototype contract - kexyz254peter
paths:
  /health/live:
    get:
      operationId: healthLive
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      operationId: healthReady
      responses:
        '200':
          description: Required dependencies are ready
  /v1/tasks:
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/task-request.schema.json'
      responses:
        '202':
          description: Task accepted for interpretation
        '400':
          description: Invalid request
        '401':
          description: Invalid user session
