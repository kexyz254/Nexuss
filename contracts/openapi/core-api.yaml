openapi: 3.1.0
info:
  title: Nexuss Core API
  version: 0.2.0
  description: Confidential P2 UI and local read-only capability contract - kexyz254peter
paths:
  /health/live:
    get:
      operationId: healthLive
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: {type: string, const: alive}
                  service: {type: string, const: nexuss-core-api}
                  version: {type: string, const: 0.2.0}
  /health/ready:
    get:
      operationId: healthReady
      responses:
        '200':
          description: P2 interface and local read-only executor are ready
          content:
            application/json:
              schema:
                type: object
                required: [status, mode]
                properties:
                  status: {type: string, const: ready}
                  mode: {type: string, const: p2_ui_local_readonly}
  /v1/tasks:
    post:
      operationId: createTask
      parameters:
        - in: header
          name: X-Nexuss-Session-ID
          required: true
          schema: {type: string, format: uuid}
        - in: header
          name: X-Nexuss-Session-Authenticated
          required: true
          schema: {type: boolean}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/task-request.schema.json'
      responses:
        '202': {description: Task lifecycle evaluated}
        '401': {description: Invalid user session}
  /v1/tasks/{task_id}:
    get:
      operationId: getTask
      parameters:
        - in: path
          name: task_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {description: Current task state}
        '404': {description: Task not found}
  /v1/tasks/{task_id}/receipt:
    get:
      operationId: getTaskReceipt
      parameters:
        - in: path
          name: task_id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Immutable Action Receipt
          content:
            application/json:
              schema:
                $ref: '../schemas/action-receipt.schema.json'
        '404': {description: Receipt not found}
