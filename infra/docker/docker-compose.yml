services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexuss
      POSTGRES_PASSWORD: nexuss-dev-only
      POSTGRES_DB: nexuss
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexuss"]
      interval: 5s
      timeout: 3s
      retries: 10
