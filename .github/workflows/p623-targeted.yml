name: P6.23 Self-Update Default Routing

on:
  push:
    branches: [feature/p623-self-update-default]
  pull_request:
    paths:
      - 'src/nexuss/conversation/stabilization.py'
      - 'src/nexuss/core/intents.py'
      - 'tests/conversation/test_p623_self_update_default.py'
      - '.github/workflows/p623-targeted.yml'

permissions:
  contents: read

jobs:
  verify-p623:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Compile
        run: |
          python -m compileall -q \
            src/nexuss/conversation/stabilization.py \
            src/nexuss/core/intents.py
      - name: Ruff
        run: |
          ruff check \
            src/nexuss/conversation/stabilization.py \
            src/nexuss/core/intents.py \
            tests/conversation/test_p623_self_update_default.py
      - name: Mypy
        run: |
          mypy \
            src/nexuss/conversation/stabilization.py \
            src/nexuss/core/intents.py
      - name: Update routing regressions
        run: |
          pytest --noconftest --import-mode=importlib -q \
            tests/conversation/test_p623_self_update_default.py \
            tests/conversation/test_p620_update_lifecycle.py
      - name: Bandit
        run: |
          bandit -q \
            src/nexuss/conversation/stabilization.py \
            src/nexuss/core/intents.py
