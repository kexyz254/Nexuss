name: Nexuss CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python scripts/validate_repository.py
      - run: ruff check .
      - run: mypy services libs scripts
      - run: pytest --cov=services --cov=libs --cov-report=term-missing
      - run: bandit -q -r services libs scripts
