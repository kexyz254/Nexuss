name: P6.32 TAS Dashboard Release
on:
  pull_request:
    paths:
      - 'src/nexuss/connectors/trading.py'
      - 'src/nexuss/conversation/trading.py'
      - 'src/nexuss/conversation/tas_release.py'
      - 'tests/conversation/test_tas_release.py'
      - '.github/workflows/p632-tas-release.yml'
  workflow_dispatch:
jobs:
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest --noconftest --import-mode=importlib -q tests/conversation/test_tas_release.py tests/conversation/test_tas_price_call_results.py tests/conversation/test_tas_dashboard_maintenance.py tests/connectors/test_trading.py
