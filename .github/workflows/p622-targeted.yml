name: P6.22 File Intelligence + Left Rail

on:
  push:
    branches: [feature/p622-file-context-left-rail]
  pull_request:
    paths:
      - 'src/nexuss/cognitive/runtime.py'
      - 'src/nexuss/conversation/api.py'
      - 'src/nexuss/chat_files/extract.py'
      - 'src/nexuss/ui/app.js'
      - 'src/nexuss/ui/index.html'
      - 'src/nexuss/ui/styles.css'
      - 'src/nexuss/api/app.py'
      - 'tests/cognitive/test_p622_bounded_input.py'
      - 'tests/chat_files/test_p622_archive_priority.py'
      - 'tests/ui/test_p622_left_rail_progress.py'
      - '.github/workflows/p622-targeted.yml'

permissions:
  contents: read

jobs:
  verify-p622:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Compile changed Python
        run: |
          python -m compileall -q \
            src/nexuss/cognitive/runtime.py \
            src/nexuss/conversation/api.py \
            src/nexuss/chat_files/extract.py \
            src/nexuss/api/app.py
      - name: Ruff
        run: |
          ruff check \
            src/nexuss/cognitive/runtime.py \
            src/nexuss/conversation/api.py \
            src/nexuss/chat_files/extract.py \
            tests/cognitive/test_p622_bounded_input.py \
            tests/chat_files/test_p622_archive_priority.py \
            tests/ui/test_p622_left_rail_progress.py
      - name: Mypy
        run: |
          mypy \
            src/nexuss/cognitive/runtime.py \
            src/nexuss/conversation/api.py \
            src/nexuss/chat_files/extract.py
      - name: P6.22 regression tests
        run: |
          pytest --noconftest --import-mode=importlib -q \
            tests/cognitive/test_p622_bounded_input.py \
            tests/chat_files/test_p622_archive_priority.py \
            tests/ui/test_p622_left_rail_progress.py \
            tests/chat_files/test_p620_zip_intelligence.py \
            tests/ui/test_p620_intent_lifecycle.py \
            tests/core/test_p621_runtime_identity.py \
            tests/ui/test_p621_runtime_truth_progress.py
      - name: JavaScript syntax
        run: |
          node --check src/nexuss/ui/app.js
          node --check src/nexuss/ui/file_workspace.js
      - name: P6.22 UI contract
        run: |
          grep -q 'P6.22' src/nexuss/ui/index.html
          grep -q 'app.js?v=p622' src/nexuss/ui/index.html
          grep -q 'minmax(190px, 38vh)' src/nexuss/ui/styles.css
      - name: Bandit
        run: |
          bandit -q \
            src/nexuss/cognitive/runtime.py \
            src/nexuss/conversation/api.py \
            src/nexuss/chat_files/extract.py
