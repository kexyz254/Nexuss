name: P6.20 Intent Lifecycle Verification

on:
  push:
    branches: [feature/p620-intent-lifecycle-awareness]
  pull_request:
    paths:
      - 'src/nexuss/conversation/stabilization.py'
      - 'src/nexuss/conversation/store.py'
      - 'src/nexuss/interactions/service.py'
      - 'src/nexuss/interactions/api.py'
      - 'src/nexuss/core/executor.py'
      - 'src/nexuss/core/planner.py'
      - 'src/nexuss/core/service.py'
      - 'src/nexuss/chat_files/extract.py'
      - 'src/nexuss/ui/app.js'
      - 'src/nexuss/ui/file_workspace.js'
      - 'src/nexuss/ui/index.html'
      - 'tests/conversation/test_p620_update_lifecycle.py'
      - 'tests/conversation/test_p620_terminal_report_persistence.py'
      - 'tests/core/test_p620_update_reporting.py'
      - 'tests/core/test_p620_daily_briefing.py'
      - 'tests/chat_files/test_p620_zip_intelligence.py'
      - 'tests/ui/test_p620_intent_lifecycle.py'
      - 'tests/interactions/test_p620_lifecycle_awareness.py'
      - '.github/workflows/p620-targeted.yml'

permissions:
  contents: read

jobs:
  verify-p620:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Targeted Ruff
        run: |
          ruff check \
            src/nexuss/conversation/stabilization.py \
            src/nexuss/conversation/store.py \
            src/nexuss/interactions/api.py \
            src/nexuss/interactions/service.py \
            src/nexuss/core/executor.py \
            src/nexuss/core/planner.py \
            src/nexuss/chat_files/extract.py \
            tests/conversation/test_p620_update_lifecycle.py \
            tests/conversation/test_p620_terminal_report_persistence.py \
            tests/interactions/test_p620_lifecycle_awareness.py \
            tests/core/test_p620_update_reporting.py \
            tests/core/test_p620_daily_briefing.py \
            tests/chat_files/test_p620_zip_intelligence.py \
            tests/ui/test_p620_intent_lifecycle.py
      - name: Targeted mypy
        run: |
          mypy \
            src/nexuss/conversation/stabilization.py \
            src/nexuss/conversation/store.py \
            src/nexuss/interactions/service.py \
            src/nexuss/chat_files/extract.py
      - name: P6.20 regression tests
        run: |
          pytest --noconftest --import-mode=importlib -q \
            tests/conversation/test_p620_update_lifecycle.py \
            tests/conversation/test_p620_terminal_report_persistence.py \
            tests/interactions/test_p620_lifecycle_awareness.py \
            tests/core/test_p620_update_reporting.py \
            tests/core/test_p620_daily_briefing.py \
            tests/chat_files/test_p620_zip_intelligence.py \
            tests/ui/test_p620_intent_lifecycle.py \
            tests/conversation/test_p611_stabilization.py \
            tests/chat_files/test_workspace_store.py \
            tests/ui/test_p618_chat_files.py
      - name: JavaScript syntax
        run: |
          node --check src/nexuss/ui/app.js
          node --check src/nexuss/ui/file_workspace.js
      - name: Targeted Bandit
        run: |
          bandit -q \
            src/nexuss/conversation/stabilization.py \
            src/nexuss/interactions/service.py \
            src/nexuss/chat_files/extract.py
