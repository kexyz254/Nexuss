name: P6.16B Targeted Verification

on:
  pull_request:
    paths:
      - 'src/nexuss/local_control/**'
      - 'src/nexuss/intelligence/system.py'
      - 'src/nexuss/core/**'
      - 'src/nexuss/domain/models.py'
      - 'scripts/start_p5.ps1'
      - 'scripts/stop_p5.ps1'
      - 'scripts/restart_after_verified_update.ps1'
      - 'tests/local_control/**'
      - 'tests/core/test_p616b_local_control.py'
      - 'tests/integration/test_p616b_local_control_startup.py'
      - '.github/workflows/p616b-targeted.yml'

permissions:
  contents: read

jobs:
  verify-p616b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Targeted Ruff
        run: |
          ruff check             src/nexuss/local_control             src/nexuss/intelligence/system.py             tests/local_control             tests/core/test_p616b_local_control.py             tests/integration/test_p616b_local_control_startup.py
      - name: Targeted mypy
        run: |
          mypy             src/nexuss/local_control             src/nexuss/intelligence/system.py
      - name: P6.16B regression tests
        run: |
          pytest --import-mode=importlib -q             tests/local_control             tests/core/test_p616b_local_control.py             tests/integration/test_p616b_local_control_startup.py             tests/orchestration/test_agent_supervisor.py             tests/ui/test_p616_agent_supervisor.py             tests/ui/test_p615_multi_chat_layer.py
      - name: PowerShell parse
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content scripts/start_p5.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content scripts/stop_p5.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content scripts/restart_after_verified_update.ps1 -Raw)) | Out-Null
      - name: Targeted Bandit
        run: |
          bandit -q -r             src/nexuss/local_control             src/nexuss/intelligence/system.py
