name: P6.31 BTC Price Call Results
on:
  pull_request:
    paths:
      - 'src/nexuss/connectors/trading.py'
      - 'src/nexuss/conversation/trading.py'
      - 'tests/conversation/test_tas_price_call_results.py'
      - '.github/workflows/p631-btc-price-call-results.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest --noconftest --import-mode=importlib -q tests/conversation/test_tas_price_call_results.py tests/conversation/test_tas_dashboard_maintenance.py tests/connectors/test_trading.py
